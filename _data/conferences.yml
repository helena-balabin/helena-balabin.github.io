- name: Alzheimer's Association International Conference (AAIC) 2024
  location: Philadelphia, USA
  dates: July 2024
  start_date: 2024-07-22
  gallery:
    - image: assets/img/conferences/IMG_3397.jpg
      caption: I had so many interesting conversations with people from all sorts of backgrounds, and it was nice to see what potential impact digital speech-based biomarkers could have for the early diagnosis of Alzheimer's disease in the near future.
    - image: assets/img/conferences/IMG_3280.jpg
